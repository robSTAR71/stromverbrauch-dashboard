<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Energie.Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f4f8; color: #1a2332; font-family: 'DM Mono', monospace; min-height: 100vh; padding-bottom: 80px; }

/* Header */
.header { background: #fff; padding: 28px 24px 20px; border-bottom: 2px solid #e8edf3; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.subtitle { font-size: 11px; letter-spacing: 4px; color: #00a382; text-transform: uppercase; margin-bottom: 6px; }
h1 { font-family: 'Syne', sans-serif; font-size: clamp(26px,6vw,42px); font-weight: 800; color: #1a2332; line-height: 1; }
h1 span { color: #00a382; }
.header-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
.refresh-btn { cursor: pointer; padding: 10px 20px; border-radius: 10px; border: 2px solid #00a382; background: #fff; color: #00a382; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
.refresh-btn:active { background: #e6f7f3; }
.last-updated { font-size: 12px; color: #8a9bb0; }

/* View tabs */
.view-tabs { display: flex; gap: 0; margin: 0 24px 24px; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.view-tab { flex: 1; cursor: pointer; padding: 14px 8px; border-radius: 10px; font-size: 15px; font-weight: 500; text-align: center; border: none; background: transparent; color: #8a9bb0; font-family: 'DM Mono', monospace; transition: all 0.2s; }
.view-tab.active { background: #00a382; color: #fff; box-shadow: 0 2px 8px rgba(0,163,130,0.3); }

/* Date chips */
.date-chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 24px 24px; }
.date-chip { cursor: pointer; padding: 10px 18px; border-radius: 12px; font-size: 14px; border: 2px solid #d0dae6; background: #fff; color: #4a5a6a; font-family: 'DM Mono', monospace; font-weight: 500; }
.date-chip.active { background: #00a382; border-color: #00a382; color: #fff; }

/* Content */
.content { padding: 0 24px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid transparent; }
.stat-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a9bb0; margin-bottom: 8px; }
.stat-value { font-size: clamp(16px,4vw,22px); font-weight: 500; line-height: 1.2; }

/* Chart */
.chart-card { background: #fff; border-radius: 16px; padding: 20px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
.chart-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8a9bb0; margin-bottom: 16px; }

/* Error / Loading */
.error { background: #fff0f0; border: 2px solid #ffb0b0; border-radius: 14px; padding: 20px; color: #cc4444; margin: 0 24px; }
.loading { text-align: center; padding: 60px 0; color: #8a9bb0; font-size: 15px; }

/* Week/Month table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 8px; color: #8a9bb0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid #e8edf3; }
.data-table td { padding: 12px 8px; border-bottom: 1px solid #f0f4f8; color: #1a2332; }
.data-table tr:hover td { background: #f7faf9; }
.kwh-bar { display: flex; align-items: center; gap: 8px; }
.kwh-bar-fill { height: 8px; border-radius: 4px; background: #00a382; min-width: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="subtitle">Stromverbrauch Monitor</div>
  <h1>Energie<span>.</span>Dashboard</h1>
  <div class="header-bottom">
    <div class="last-updated" id="lastUpdated">Lade Daten…</div>
    <button class="refresh-btn" onclick="fetchData()">⟳ Aktualisieren</button>
  </div>
</div>

<!-- View Tabs -->
<div class="view-tabs">
  <button class="view-tab active" onclick="setView('tag')" id="tab-tag">Tag</button>
  <button class="view-tab" onclick="setView('woche')" id="tab-woche">Woche</button>
  <button class="view-tab" onclick="setView('monat')" id="tab-monat">Monat</button>
</div>

<div id="status" class="loading">⟳ Lade Daten…</div>
<div id="dateChips" class="date-chips"></div>
<div class="content">
  <div id="stats" class="stats" style="display:none"></div>
  <div id="charts"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyxL3taLYzoeoHgrHiAFkvoZipQ1lUEdi3gRdyt-Hzl3_d2X5vV1OczPMs_PSVdUroSmg/exec";

let allData = {}, selectedDate = null, charts = {}, currentView = "tag";

function parseRow(cols) {
  if (!cols || cols.length < 3) return null;
  const raw = String(cols[0] || "").trim();
  let date = null;
  if (raw.match(/^\d{4}-\d{2}-\d{2}T/)) {
    date = new Date(new Date(raw).getTime() + 2 * 60 * 60 * 1000);
  } else {
    const m = raw.match(/(\d{1,2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
    if (m) date = new Date(`${m[3]}-${m[2]}-${String(m[1]).padStart(2,"0")}T${m[4]}:${m[5]}:00`);
  }
  if (!date || isNaN(date)) return null;
  let kwh = typeof cols[2] === "number" ? cols[2] : parseFloat(String(cols[2]).replace(",","."));
  if (isNaN(kwh)) return null;
  if (kwh > 10) kwh = kwh / 1000;
  return { date, kwh };
}

function formatDateKey(date) {
  return `${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.${date.getFullYear()}`;
}

function getWeekKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay() + 1);
  return `KW ${getWeekNumber(date)} (${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.)`;
}

function getWeekNumber(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
  const week1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d-week1)/86400000 - 3 + (week1.getDay()+6)%7)/7);
}

function getMonthKey(date) {
  const months = ["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  return `${months[date.getMonth()]} ${date.getFullYear()}`;
}

async function fetchData() {
  document.getElementById("status").innerHTML = "⟳ Lade Daten…";
  document.getElementById("status").style.display = "block";
  document.getElementById("stats").style.display = "none";
  document.getElementById("charts").innerHTML = "";
  document.getElementById("dateChips").innerHTML = "";

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("Status " + res.status);
    const rows = await res.json();

    allData = {};
    for (let i = 1; i < rows.length; i++) {
      const parsed = parseRow(rows[i]);
      if (!parsed) continue;
      const { date, kwh } = parsed;
      const key = formatDateKey(date);
      if (!allData[key]) allData[key] = [];
      allData[key].push({ date, kwh, time: `${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`, hour: date.getHours() });
    }

    if (Object.keys(allData).length === 0) throw new Error("Keine Daten gefunden.");

    document.getElementById("status").style.display = "none";
    document.getElementById("lastUpdated").textContent = "Zuletzt: " + new Date().toLocaleTimeString("de-AT");

    renderView();
  } catch(e) {
    document.getElementById("status").innerHTML = `<div class="error">⚠ Fehler: ${e.message}</div>`;
  }
}

function setView(view) {
  currentView = view;
  ["tag","woche","monat"].forEach(v => {
    document.getElementById("tab-"+v).classList.toggle("active", v===view);
  });
  renderView();
}

function renderView() {
  if (currentView === "tag") renderTagView();
  else if (currentView === "woche") renderAggregateView("woche");
  else renderAggregateView("monat");
}

function getSortedDates() {
  return Object.keys(allData).sort((a,b) => {
    const [da,ma,ya]=a.split("."); const [db,mb,yb]=b.split(".");
    return new Date(`${yb}-${mb}-${db}`) - new Date(`${ya}-${ma}-${da}`);
  });
}

function renderTagView() {
  const dates = getSortedDates();
  document.getElementById("dateChips").innerHTML = dates.map(d =>
    `<button class="date-chip ${d===selectedDate?'active':''}" onclick="selectDate('${d}')">${d}</button>`
  ).join("");
  if (!selectedDate || !allData[selectedDate]) selectDate(dates[0]);
  else renderTagDashboard();
}

function selectDate(date) {
  selectedDate = date;
  document.querySelectorAll(".date-chip").forEach(c => c.classList.toggle("active", c.textContent===date));
  renderTagDashboard();
}

function renderTagDashboard() {
  const data = allData[selectedDate] || [];
  const total = data.reduce((s,d)=>s+d.kwh,0);
  const avg = data.length ? total/data.length : 0;
  const hours = {};
  data.forEach(({hour,kwh}) => { hours[hour]=(hours[hour]||0)+kwh; });
  const hourlyArr = Array.from({length:24},(_,h)=>({hour:`${String(h).padStart(2,"0")}:00`,kwh:+(hours[h]||0).toFixed(3)}));
  const peakH = hourlyArr.reduce((a,b)=>b.kwh>a.kwh?b:a);

  document.getElementById("stats").style.display = "grid";
  document.getElementById("stats").innerHTML = [
    {label:"Tagesverbrauch", value:`${total.toFixed(3)} kWh`, color:"#00a382", border:"#00a382"},
    {label:"Spitzenstunde", value:`${peakH.hour}`, color:"#e05a2b", border:"#e05a2b"},
    {label:"Ø pro 15 Min", value:`${avg.toFixed(3)} kWh`, color:"#2b7be0", border:"#2b7be0"},
    {label:"Tage gesamt", value:Object.keys(allData).length, color:"#8a4be0", border:"#8a4be0"},
  ].map(s=>`<div class="stat-card" style="border-left-color:${s.border}"><div class="stat-label">${s.label}</div><div class="stat-value" style="color:${s.color}">${s.value}</div></div>`).join("");

  destroyCharts();
  document.getElementById("charts").innerHTML = `
    <div class="chart-card"><div class="chart-title">Tagesverlauf — 15-Min-Intervalle</div><canvas id="chartDay" height="100"></canvas></div>
    <div class="chart-card"><div class="chart-title">Verbrauch je Stunde</div><canvas id="chartHour" height="80"></canvas></div>
  `;

  const grid = "#e8edf3", tick = "#8a9bb0", font = {family:"DM Mono",size:11};

  charts.day = new Chart(document.getElementById("chartDay"),{type:"line",data:{
    labels:data.map(d=>d.time),
    datasets:[{data:data.map(d=>d.kwh),borderColor:"#00a382",borderWidth:2,fill:true,backgroundColor:"rgba(0,163,130,0.1)",pointRadius:0,tension:0.3}]
  },options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},ticks:{color:tick,maxTicksLimit:12,font}},y:{grid:{color:grid},ticks:{color:tick,font}}}}});

  charts.hour = new Chart(document.getElementById("chartHour"),{type:"bar",data:{
    labels:hourlyArr.map(h=>h.hour),
    datasets:[{data:hourlyArr.map(h=>h.kwh),backgroundColor:"rgba(0,163,130,0.7)",borderRadius:4}]
  },options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},ticks:{color:tick,font:{family:"DM Mono",size:10}}},y:{grid:{color:grid},ticks:{color:tick,font}}}}});
}

function renderAggregateView(mode) {
  document.getElementById("dateChips").innerHTML = "";
  document.getElementById("stats").style.display = "none";
  destroyCharts();

  // Aggregate data
  const grouped = {};
  Object.entries(allData).forEach(([dateKey, entries]) => {
    const date = entries[0].date;
    const key = mode === "woche" ? getWeekKey(date) : getMonthKey(date);
    if (!grouped[key]) grouped[key] = { total: 0, days: new Set(), date };
    grouped[key].total += entries.reduce((s,e)=>s+e.kwh,0);
    grouped[key].days.add(dateKey);
  });

  const keys = Object.keys(grouped).sort((a,b) => grouped[a].date - grouped[b].date);
  const totals = keys.map(k => +grouped[k].total.toFixed(3));
  const maxVal = Math.max(...totals);

  // Stats
  const totalAll = totals.reduce((s,v)=>s+v,0);
  const avgPeriod = keys.length ? totalAll/keys.length : 0;
  const peakPeriod = keys[totals.indexOf(maxVal)];

  document.getElementById("stats").style.display = "grid";
  document.getElementById("stats").innerHTML = [
    {label:"Gesamt", value:`${totalAll.toFixed(2)} kWh`, color:"#00a382", border:"#00a382"},
    {label:mode==="woche"?"Ø pro Woche":"Ø pro Monat", value:`${avgPeriod.toFixed(2)} kWh`, color:"#2b7be0", border:"#2b7be0"},
    {label:"Höchster Verbrauch", value:peakPeriod||"-", color:"#e05a2b", border:"#e05a2b"},
    {label:mode==="woche"?"Wochen":"Monate", value:keys.length, color:"#8a4be0", border:"#8a4be0"},
  ].map(s=>`<div class="stat-card" style="border-left-color:${s.border}"><div class="stat-label">${s.label}</div><div class="stat-value" style="color:${s.color}">${s.value}</div></div>`).join("");

  // Chart
  document.getElementById("charts").innerHTML = `
    <div class="chart-card">
      <div class="chart-title">${mode==="woche"?"Wochenverbrauch":"Monatsverbrauch"}</div>
      <canvas id="chartAgg" height="100"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Detailtabelle</div>
      <table class="data-table">
        <thead><tr><th>${mode==="woche"?"Woche":"Monat"}</th><th>Verbrauch</th><th>Tage</th></tr></thead>
        <tbody>
          ${keys.map((k,i)=>`<tr>
            <td>${k}</td>
            <td><div class="kwh-bar"><div class="kwh-bar-fill" style="width:${Math.round((totals[i]/maxVal)*120)}px"></div>${totals[i].toFixed(3)} kWh</div></td>
            <td>${grouped[k].days.size}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;

  const grid = "#e8edf3", tick = "#8a9bb0", font = {family:"DM Mono",size:11};
  charts.agg = new Chart(document.getElementById("chartAgg"),{type:"bar",data:{
    labels:keys,
    datasets:[{data:totals,backgroundColor:"rgba(0,163,130,0.7)",borderRadius:6,borderSkipped:false}]
  },options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:grid},ticks:{color:tick,font,maxRotation:45}},y:{grid:{color:grid},ticks:{color:tick,font},title:{display:true,text:"kWh",color:tick,font}}}}});
}

function destroyCharts() {
  Object.values(charts).forEach(c=>c.destroy());
  charts = {};
}

fetchData();
</script>
</body>
</html>
